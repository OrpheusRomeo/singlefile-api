version: '3.8'

services:
  singlefile-api:
    build: 
      context: .
      dockerfile: Dockerfile
      # 指定构建平台
      platforms:
        - linux/amd64
    container_name: singlefile-api-node-linuxe
    image: singlefile-api:v43
    ports:
      - "3014:3000"
    volumes:
      - ./data/downloads:/downloads
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CHROMIUM_PATH=/usr/bin/chromium
      # 添加针对 Mac 的特殊配置
      - DISABLE_WEB_SECURITY=true
      - ENABLE_FEATURES=Vulkan
    restart: unless-stopped
    # 针对 Mac 的优化配置
    sysctls:
      - net.ipv4.ip_forward=1
    # 安全配置
    security_opt:
      - seccomp:unconfined
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
